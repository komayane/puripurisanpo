if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowUp'||e.key===' ')jump();else return;e.preventDefault()});
let sx=null,sy=0,swiped=false,tapOK=false;
app.addEventListener('pointerdown',e=>{if(state==='home'){sx=null;swiped=false;tapOK=true;return}if(state!=='play'||paused)return;sx=e.clientX;sy=e.clientY;swiped=false;tapOK=true});
app.addEventListener('pointermove',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy,th=Math.max(18,app.clientWidth*.06);
if(Math.max(Math.abs(dx),Math.abs(dy))<th)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();sx=null;swiped=true;tapOK=false});
addEventListener('pointerup',e=>{if(tapOK&&!swiped&&((state==='play'&&!paused)||state==='home')){const rc=st.getBoundingClientRect(),cx=(e.clientX-rc.left)*540/rc.width,cy=(e.clientY-rc.top)*960/rc.height,
top=YD-DH*DS+DS-Math.round(jh)*DS,left=dogX-16*DS;if(cx>left-20&&cx<left+DW*DS+20&&cy>top-20&&cy<top+DH*DS+20){if(lookT<=0)sfx('look');lookT=1.2;hearts.push({x:dogX+30,y:top+20,a:0,vx:20,ph:Math.random()*6})}}sx=null;tapOK=false});
addEventListener('pointercancel',()=>{sx=null;tapOK=false});
function pause(){if(state==='play'&&!paused){paused=true;musicStop();show('pauseScreen')}}
function resume(){if(paused){auInit();paused=false;show('hud');last=performance.now();musicStart()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
$('resumeBtn').onclick=resume;
const pb=$('pauseBtn');pb.addEventListener('pointerdown',e=>e.stopPropagation());pb.onclick=()=>{auInit();sfx('click');pause();pb.blur()};
$('quitBtn').onclick=()=>{auInit();sfx('click');paused=false;goHome()};
$('startBtn').onclick=startGame;$('retryBtn').onclick=startGame;$('homeBtn').onclick=()=>{auInit();sfx('click');goHome()};$('changeName').onclick=()=>{auInit();sfx('click');goName()};
AU.muted=store.get('komachi_mute')==='1';
const muteBtn=$('mute');function paintMute(){muteBtn.textContent=AU.muted?'♪ OFF':'♪ ON';muteBtn.classList.toggle('off',AU.muted)}paintMute();
muteBtn.addEventListener('pointerdown',e=>e.stopPropagation());
muteBtn.onclick=()=>{auInit();AU.muted=!AU.muted;store.set('komachi_mute',AU.muted?'1':'0');if(AU.master)AU.master.gain.value=AU.muted?0:1;paintMute();if(state==='home')musicStart();muteBtn.blur()};
app.addEventListener('pointerdown',()=>{const first=!AU.ctx;auInit();if(first&&(state==='home'||state==='name'))musicStart()},true);
$('nameInput').addEventListener('input',()=>{$('nameErr').textContent=''});
function submitName(){auInit();const v=$('nameInput').value.trim();
if(!v){$('nameErr').textContent='なまえを入力してね';return}
playerName=v.slice(0,10);store.set('komachi_name',playerName);goHome()}
$('nameOk').onclick=submitName;
$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();submitName()}});
document.addEventListener('touchmove',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()},{passive:false});
if(playerName)goHome();else goName();
})();
</script>
</body>
